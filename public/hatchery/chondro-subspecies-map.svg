<g fill="#95b9a4" font-family="Arial,sans-serif" font-size="15" letter-spacing="3"><text x="72" y="830">BROAD BIOGEOGRAPHIC GAME GUIDE · NOT GPS-LEVEL PROVENANCE</text></g>
