<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Snake Sorter Helper</title>
  <style>
    body{font:13px system-ui;background:#111;color:#eee;width:320px;margin:0;padding:14px}
    button{width:100%;padding:10px;border-radius:10px;border:1px solid #345;background:#17202a;color:#dff;cursor:pointer}
    button+button{margin-top:8px}
    button:disabled{opacity:.45}
    #status{margin-top:10px;line-height:1.4;color:#aaa;white-space:pre-wrap}
  </style>
</head>
<body>
  <strong>Snake Sorter Browser Helper</strong>
  <p>Use live image references first. If those will not render in Snake Sorter, use the browser-local gallery capture fallback. Neither path bypasses access controls.</p>
  <button id="send">Send live refs to Snake Sorter</button>
  <button id="capture">Capture gallery fallback</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
