name: Refactor Chondro reproduction profile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move reproduction rules to species profile
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/ChondroBreederGameV3.tsx')
          text = path.read_text()

          old_import = 'import { CHONDRO_SPECIES_PROFILE, growthCostFor, growthRequirementFor } from "@/lib/breeder-species-profiles";'
          new_import = 'import { CHONDRO_SPECIES_PROFILE, growthCostFor, growthRequirementFor, needsExtraRecoveryYear, normalizeNeonateColorFor, randomNeonateColorFor } from "@/lib/breeder-species-profiles";'
          if text.count(old_import) != 1:
              raise SystemExit('species profile import mismatch')
          text = text.replace(old_import, new_import, 1)

          old_constants = 'const SEASON_CARE_PER_ADULT = 180;\nconst BREEDING_STAGES: Array<{ id: BreedingStage; label: string; hours: number }> = [\n  { id: "cycling", label: "Cycling", hours: 4 },\n  { id: "pairing", label: "Pairing", hours: 8 },\n  { id: "laying", label: "Laying", hours: 12 },\n  { id: "incubation", label: "Incubation", hours: 24 },\n  { id: "hatch-day", label: "Hatch Day", hours: 2 },\n];\n'
          new_constants = 'const SEASON_CARE_PER_ADULT = CHONDRO_SPECIES_PROFILE.reproduction.seasonCarePerAdult;\nconst BREEDING_STAGES = CHONDRO_SPECIES_PROFILE.reproduction.stages as Array<{ id: BreedingStage; label: string; hours: number }>;\n'
          if text.count(old_constants) != 1:
              raise SystemExit('breeding constants mismatch')
          text = text.replace(old_constants, new_constants, 1)

          old_recovery = 'function femaleNeedsRecoveryYear(dam: Snake, clutchSize: number) {\n  let chance = 0.28 + Math.max(0, clutchSize - 6) * 0.06;\n  if (dam.condition === "Excellent") chance -= 0.12;\n  if (dam.condition === "Fair") chance += 0.20;\n  chance = Math.max(0.12, Math.min(0.80, chance));\n  return Math.random() < chance;\n}\n'
          if text.count(old_recovery) != 1:
              raise SystemExit('recovery helper mismatch')
          text = text.replace(old_recovery, '', 1)

          replacements = [
              ('const neonateColor: "Red" | "Yellow" = random() < 0.38 ? "Red" : "Yellow";', 'const neonateColor = randomNeonateColorFor(CHONDRO_SPECIES_PROFILE, random);', 1),
              ('neonateColor: subspecies === "Morelia viridis" ? "Yellow" : neonateColor,', 'neonateColor: normalizeNeonateColorFor(CHONDRO_SPECIES_PROFILE, subspecies, neonateColor),', 1),
              ('neonateColor: pureSame && subspecies === "Morelia viridis" ? "Yellow" : pick(dam.neonateColor, sire.neonateColor),', 'neonateColor: pureSame\n      ? normalizeNeonateColorFor(CHONDRO_SPECIES_PROFILE, subspecies, pick(dam.neonateColor, sire.neonateColor))\n      : pick(dam.neonateColor, sire.neonateColor),', 1),
              ('neonateColor: raw.classification === "Pure" && subspecies === "Morelia viridis" ? "Yellow" : raw.neonateColor,', 'neonateColor: raw.classification === "Pure"\n      ? normalizeNeonateColorFor(CHONDRO_SPECIES_PROFILE, subspecies, raw.neonateColor)\n      : raw.neonateColor,', 1),
              ('const needsExtraRecovery = femaleNeedsRecoveryYear(clutch.dam, clutch.offspring.length);', 'const needsExtraRecovery = needsExtraRecoveryYear(\n      CHONDRO_SPECIES_PROFILE,\n      clutch.dam.condition,\n      clutch.offspring.length,\n    );', 1),
          ]
          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'Expected {expected}, found {count}: {old!r}')
              text = text.replace(old, new, expected)

          path.write_text(text)
          PY

      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/refactor-chondro-reproduction-profile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ChondroBreederGameV3.tsx .github/workflows/refactor-chondro-reproduction-profile.yml
          git commit -m "Use species profile for Chondro reproduction rules"
          git push
