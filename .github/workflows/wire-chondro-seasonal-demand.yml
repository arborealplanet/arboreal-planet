name: Wire Chondro seasonal demand into prices

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire seasonal demand
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/ChondroBreederGameV3.tsx')
          text = path.read_text()

          old_import = 'import { inheritTraitSet } from "@/lib/chondro-genetics";\n'
          new_import = old_import + 'import { marketDemandForSeason, marketMultiplierForAnimal } from "@/lib/chondro-progression";\n'
          if text.count(old_import) != 1:
              raise SystemExit('Unexpected genetics import count')
          text = text.replace(old_import, new_import, 1)

          old_sig = 'function saleValue(a: Snake) {'
          new_sig = 'function saleValue(a: Snake, season: number) {'
          if text.count(old_sig) != 1:
              raise SystemExit('Unexpected saleValue signature count')
          text = text.replace(old_sig, new_sig, 1)

          old_tail = '  if (a.condition === "Fair") value *= 0.82;\n  return Math.max(250, Math.round(value / 25) * 25);\n}'
          new_tail = '  if (a.condition === "Fair") value *= 0.82;\n  value *= marketMultiplierForAnimal(marketDemandForSeason(season), a);\n  return Math.max(250, Math.round(value / 25) * 25);\n}'
          if text.count(old_tail) != 1:
              raise SystemExit('Unexpected saleValue tail count')
          text = text.replace(old_tail, new_tail, 1)

          replacements = [
              ('saleValue(a)', 'saleValue(a, season)', 1),
              ('saleValue(baby)', 'saleValue(baby, season)', 2),
              ('saleValue(animal)', 'saleValue(animal, season)', 1),
          ]
          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'Expected {expected}, found {count}: {old!r}')
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/wire-chondro-seasonal-demand.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ChondroBreederGameV3.tsx .github/workflows/wire-chondro-seasonal-demand.yml
          git commit -m "Make Chondro seasonal demand affect sale prices"
          git push
