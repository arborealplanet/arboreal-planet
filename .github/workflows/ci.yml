name: Validate Arboreal Planet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Snake Sorter Python
        run: |
          python -m compileall -q ml/snake_sorter
          python -m py_compile scripts/snake_sorter_capture_worker.py
          python -m py_compile scripts/snake_sorter_live_ref_probe.py

      - name: Validate Snake Sorter browser helper
        run: |
          node --check tools/snake-sorter-browser-helper/popup.js
          node --check tools/snake-sorter-browser-helper/background.js
          node --check tools/snake-sorter-browser-helper/content.js
          node -e "JSON.parse(require('fs').readFileSync('tools/snake-sorter-browser-helper/manifest.json','utf8'))"

      - name: Test Snake Sorter policy rules
        run: python -m unittest discover -s ml/snake_sorter/tests -p "test_*.py" -v

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
