name: Add Chondro Store Enclosures

on:
  push:
    paths:
      - ".github/workflows/add-chondro-store-enclosures.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Add enclosure purchases to Store
        run: node scripts/add-chondro-store-enclosures.mjs
      - name: Commit canonical source
        run: |
          if git diff --quiet -- src/components/ChondroBreederExpandedShop.tsx src/components/ChondroBreederGameV3.tsx; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ChondroBreederExpandedShop.tsx src/components/ChondroBreederGameV3.tsx
          git commit -m "Put enclosure purchases at top of Chondro Store"
          git push
# retry after script syntax fix
