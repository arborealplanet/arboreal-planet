name: Materialize Chondro Source

on:
  push:
    paths:
      - ".github/workflows/materialize-chondro-source.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Materialize canonical Chondro game source
        run: |
          node scripts/patch-chondro-breeding-flow.mjs
          node scripts/patch-chondro-screen-mode.mjs
          node scripts/patch-chondro-save-events.mjs
      - name: Commit canonical Chondro game source
        run: |
          if git diff --quiet -- src/components/ChondroBreederGameV3.tsx; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ChondroBreederGameV3.tsx
          git commit -m "Materialize canonical Chondro game source"
          git push