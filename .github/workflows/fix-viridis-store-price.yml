name: Fix Viridis store pricing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-viridis-store-price.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch store pricing to use normalized neonate color
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/ChondroBreederGameV3.tsx')
          text = path.read_text()
          old = '(neonateColor === "Red" ? 600 : 0)'
          new = '(snake.neonateColor === "Red" ? 600 : 0)'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy price expression, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          grep -F '(snake.neonateColor === "Red" ? 600 : 0)' src/components/ChondroBreederGameV3.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-viridis-store-price.yml
          git add src/components/ChondroBreederGameV3.tsx
          git commit -m 'Fix Viridis store neonate color pricing'
          git push
