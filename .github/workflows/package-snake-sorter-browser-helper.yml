name: Package Snake Sorter Browser Helper

on:
  push:
    branches: [main]
    paths:
      - "tools/snake-sorter-browser-helper/**"
      - ".github/workflows/package-snake-sorter-browser-helper.yml"

permissions:
  contents: write

concurrency:
  group: package-snake-sorter-browser-helper
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit packaged helper
        shell: bash
        run: |
          git config user.name "arborealplanet-bot"
          git config user.email "arborealplanet@gmail.com"

          for attempt in 1 2 3 4; do
            echo "Package push attempt $attempt"

            git fetch origin main
            git rebase origin/main

            mkdir -p public/downloads
            rm -f public/downloads/snake-sorter-browser-helper.zip
            (
              cd tools/snake-sorter-browser-helper
              zip -qr ../../public/downloads/snake-sorter-browser-helper.zip .
            )

            if [ -z "$(git status --porcelain -- public/downloads/snake-sorter-browser-helper.zip)" ]; then
              echo "Helper package is already current."
              exit 0
            fi

            git add public/downloads/snake-sorter-browser-helper.zip

            if [ "$(git log -1 --format=%s)" = "Package Snake Sorter browser helper" ]; then
              git commit --amend --no-edit
            else
              git commit -m "Package Snake Sorter browser helper"
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Main moved during package push; retrying safely."
          done

          echo "Could not publish helper package after retries."
          exit 1
