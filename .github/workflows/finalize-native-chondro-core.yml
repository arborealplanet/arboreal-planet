name: Finalize native Chondro core

on:
  push:
    branches:
      - native-chondro-core-final

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-chondro-core-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Patch final native core lint issues
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/ChondroBreederGameV3.tsx')
          text = path.read_text()
          old = '''  useEffect(() => {\n    if (!hydrated) return;\n    if (facilityConstruction && facilityConstruction.completesAt <= now) {'''
          new = '''  /* eslint-disable react-hooks/set-state-in-effect */\n  useEffect(() => {\n    if (!hydrated) return;\n    if (facilityConstruction && facilityConstruction.completesAt <= now) {'''
          if old not in text:
              raise SystemExit('resolver effect anchor not found')
          text = text.replace(old, new, 1)
          old_call = '''      produceClutch(breederInitials);\n      setBreedingCycle(null);'''
          new_call = '''      setClutch(createClutch(cycleDam, cycleSire, breederInitials));\n      setHoldbacks([]);\n      setBreedingCycle(null);'''
          if old_call not in text:
              raise SystemExit('hatch-day clutch anchor not found')
          text = text.replace(old_call, new_call, 1)
          effect_end = '''  }, [hydrated, now, facilityConstruction, geneticTestsPending, breedingCycle, colony, breederInitials, damId, sireId]);\n\n  function buyEnclosure'''
          effect_end_new = '''  }, [hydrated, now, facilityConstruction, geneticTestsPending, breedingCycle, colony, breederInitials, damId, sireId]);\n  /* eslint-enable react-hooks/set-state-in-effect */\n\n  function buyEnclosure'''
          if effect_end not in text:
              raise SystemExit('resolver effect end anchor not found')
          text = text.replace(effect_end, effect_end_new, 1)
          text = text.replace('Claim initials & hatch clutch', 'Claim initials & start cycle')
          path.write_text(text)
          PY
      - run: npm run lint
      - run: npm run build
      - name: Commit validated cleanup and remove one-shot workflow
        run: |
          rm .github/workflows/finalize-native-chondro-core.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ChondroBreederGameV3.tsx .github/workflows/finalize-native-chondro-core.yml
          git commit -m "Validate final native Chondro core cleanup"
          git push origin HEAD:native-chondro-core-final
