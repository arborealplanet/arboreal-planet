name: Fix Chondro Initials Recovery

on:
  push:
    paths:
      - ".github/workflows/fix-chondro-initials.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply breeder initials recovery fix
        run: node scripts/fix-chondro-breeder-initials-clutch.mjs
      - name: Commit repaired canonical source
        run: |
          if git diff --quiet -- src/components/ChondroBreederGameV3.tsx; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ChondroBreederGameV3.tsx
          git commit -m "Protect Chondro clutch from breeder initials race"
          git push
