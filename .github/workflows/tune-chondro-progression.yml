name: Tune Chondro progression

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tune breeder progression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/ChondroBreederGameV3.tsx')
          text = path.read_text()

          old_import = 'import { marketDemandForSeason, marketMultiplierForAnimal } from "@/lib/chondro-progression";'
          new_import = 'import { breedingReputationGain, marketDemandForSeason, marketMultiplierForAnimal } from "@/lib/chondro-progression";'
          if text.count(old_import) != 1:
              raise SystemExit('Unexpected progression import count')
          text = text.replace(old_import, new_import, 1)

          marker = 'function pairingFailureReason(dam: Snake, sire: Snake) {\n  if (dam.condition === "Fair") return "The female did not cycle strongly enough to complete the pairing.";\n  if (sire.condition === "Fair") return "The male showed poor breeding interest this cycle.";\n  return Math.random() < 0.5 ? "No successful lock was observed." : "The female was unreceptive and the pairing was stopped.";\n}\n'
          helper = marker + 'function femaleNeedsRecoveryYear(dam: Snake, clutchSize: number) {\n  let chance = 0.28 + Math.max(0, clutchSize - 6) * 0.06;\n  if (dam.condition === "Excellent") chance -= 0.12;\n  if (dam.condition === "Fair") chance += 0.20;\n  chance = Math.max(0.12, Math.min(0.80, chance));\n  return Math.random() < chance;\n}\n'
          if text.count(marker) != 1:
              raise SystemExit('Unexpected pairing helper marker count')
          text = text.replace(marker, helper, 1)

          dead = '  function produceClutch(initials: string) {\n    if (!dam || !sire) return;\n    setClutch(createClutch(dam, sire, initials));\n    setHoldbacks([]);\n  }\n\n'
          if text.count(dead) != 1:
              raise SystemExit('Unexpected produceClutch count')
          text = text.replace(dead, '', 1)

          old_block = '    setColony((current) => [...current, ...kept]);\n    setClutchHistory((current) => [{ ...clutch, season, holdbackIds: [...holdbacks] }, ...current]);\n    const nextEligibleSeason = Math.random() < 0.5 ? season + 1 : season + 2;\n    setFemaleRecovery((current) => ({ ...current, [clutch.dam.id]: nextEligibleSeason }));\n    setBreedingMessage(nextEligibleSeason === season + 1 ? `${clutch.dam.name} recovered in time for next season.` : `${clutch.dam.name} needs an additional recovery year before breeding again.`);\n'
          new_block = '    setColony((current) => [...current, ...kept]);\n    setClutchHistory((current) => [{ ...clutch, season, holdbackIds: [...holdbacks] }, ...current]);\n    const clutchReputation = Math.min(\n      250,\n      clutch.offspring.reduce((sum, baby) => sum + breedingReputationGain(baby), 0),\n    );\n    setCareerReputation((current) => current + clutchReputation);\n    const needsExtraRecovery = femaleNeedsRecoveryYear(clutch.dam, clutch.offspring.length);\n    const nextEligibleSeason = needsExtraRecovery ? season + 2 : season + 1;\n    setFemaleRecovery((current) => ({ ...current, [clutch.dam.id]: nextEligibleSeason }));\n    setBreedingMessage(\n      needsExtraRecovery\n        ? `${clutch.dam.name} needs an additional recovery year after this ${clutch.offspring.length}-egg clutch. +${clutchReputation} breeder reputation.`\n        : `${clutch.dam.name} recovered in time for next season. +${clutchReputation} breeder reputation.`,\n    );\n'
          if text.count(old_block) != 1:
              raise SystemExit('Unexpected clutch recovery block count')
          text = text.replace(old_block, new_block, 1)

          path.write_text(text)
          PY

      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/tune-chondro-progression.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ChondroBreederGameV3.tsx .github/workflows/tune-chondro-progression.yml
          git commit -m "Tune Chondro breeding progression and recovery"
          git push
