name: Rebuild remaining Chondro base assets

on:
  push:
    paths:
      - '.github/workflows/rebuild-chondro-base-assets-2.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild Utaraensis and Viridis base portraits
        shell: bash
        run: |
          set -euo pipefail
          cat .asset-staging/utaraensis-01.txt .asset-staging/utaraensis-02.txt .asset-staging/utaraensis-03.txt | base64 --decode > public/hatchery/snakes/utaraensis.avif
          cat .asset-staging/viridis-01.txt .asset-staging/viridis-02.txt .asset-staging/viridis-03.txt | base64 --decode > public/hatchery/snakes/viridis.avif
          test "$(stat -c%s public/hatchery/snakes/utaraensis.avif)" -eq 5198
          test "$(stat -c%s public/hatchery/snakes/viridis.avif)" -eq 5475
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/ChondroSnakeIcon.tsx')
          text = path.read_text()
          text = text.replace('const TRAIT_ART_VERSION = "2026-09-09-c";', 'const TRAIT_ART_VERSION = "2026-09-09-d";')
          text = text.replace('"Morelia azurea utaraensis": "/hatchery/snakes/utaraensis.webp",', '"Morelia azurea utaraensis": "/hatchery/snakes/utaraensis.avif",')
          text = text.replace('"Morelia viridis": "/hatchery/snakes/viridis.webp",', '"Morelia viridis": "/hatchery/snakes/viridis.avif",')
          path.write_text(text)
          PY
          rm -rf .asset-staging
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/hatchery/snakes/utaraensis.avif public/hatchery/snakes/viridis.avif src/components/ChondroSnakeIcon.tsx .asset-staging
          git commit -m 'Replace pixelated Utaraensis and Viridis base portraits'
          git push
