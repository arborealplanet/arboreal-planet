name: Enforce Viridis yellow neonates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enforce-viridis-yellow-neonates.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Viridis neonate rules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          game = Path('src/components/ChondroBreederGameV3.tsx')
          text = game.read_text()

          old = '''    subspecies,\n    locality,\n    neonateColor,\n    lifeStage,'''
          new = '''    subspecies,\n    locality,\n    neonateColor: subspecies === "Morelia viridis" ? "Yellow" : neonateColor,\n    lifeStage,'''
          if old not in text:
              raise SystemExit('makeSnake neonateColor block not found')
          text = text.replace(old, new, 1)

          old = '    neonateColor: pick(dam.neonateColor, sire.neonateColor),'
          new = '    neonateColor: pureSame && subspecies === "Morelia viridis" ? "Yellow" : pick(dam.neonateColor, sire.neonateColor),'
          if old not in text:
              raise SystemExit('offspring neonateColor block not found')
          text = text.replace(old, new, 1)

          marker = 'function normalizeSnake(raw: Snake): Snake {'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('normalizeSnake not found')
          end = text.find('\n}\n\nfunction TraitGrid', start)
          if end < 0:
              raise SystemExit('normalizeSnake end not found')
          block = text[start:end]
          old = '    subspecies,\n    locality,\n    highBlack:'
          new = '    subspecies,\n    locality,\n    neonateColor: raw.classification === "Pure" && subspecies === "Morelia viridis" ? "Yellow" : raw.neonateColor,\n    highBlack:'
          if old not in block:
              raise SystemExit('normalizeSnake insertion point not found')
          block = block.replace(old, new, 1)
          text = text[:start] + block + text[end:]
          game.write_text(text)

          icon = Path('src/components/ChondroSnakeIcon.tsx')
          text = icon.read_text()
          old = '''function neonatePortraitArt(subspecies: ChondroSubspecies, neonateColor: NeonateColor) {\n  return `/hatchery/snakes/neonates/${slugBySubspecies[subspecies]}-${neonateColor.toLowerCase()}.webp`;\n}'''
          new = '''function neonatePortraitArt(subspecies: ChondroSubspecies, neonateColor: NeonateColor) {\n  const effectiveColor: NeonateColor = subspecies === "Morelia viridis" ? "Yellow" : neonateColor;\n  return `/hatchery/snakes/neonates/${slugBySubspecies[subspecies]}-${effectiveColor.toLowerCase()}.webp`;\n}'''
          if old not in text:
              raise SystemExit('neonatePortraitArt block not found')
          icon.write_text(text.replace(old, new, 1))

          docs = Path('docs/chondro-neonate-assets.md')
          docs.write_text('''# Chondro Breeder neonate asset contract\n\n## Phase 1 — base neonates\n\nThe first neonate art pass is intentionally small and controlled. Morelia azurea azurea, M. a. pulcher, and M. a. utaraensis each require red and yellow base neonates. Morelia viridis requires a yellow base neonate only; pure M. viridis do not use a red neonate state in the game.\n\nRequired files:\n\n- `public/hatchery/snakes/neonates/azurea-red.webp`\n- `public/hatchery/snakes/neonates/azurea-yellow.webp`\n- `public/hatchery/snakes/neonates/pulcher-red.webp`\n- `public/hatchery/snakes/neonates/pulcher-yellow.webp`\n- `public/hatchery/snakes/neonates/utaraensis-red.webp`\n- `public/hatchery/snakes/neonates/utaraensis-yellow.webp`\n- `public/hatchery/snakes/neonates/viridis-yellow.webp`\n\n## Art rules\n\n- Keep a consistent locked body/pose within each approved subspecies reference set.\n- Neonate color is a visual/life-stage state, not a separate genetic trait.\n- Pure `Morelia viridis` neonates are always yellow in Chondro Breeder.\n- Preserve the visual identity of the correct subspecies instead of recoloring one universal snake into all four taxa.\n- Do not generate every trait/tier combination yet. Approve the seven base neonates first.\n- The game UI must fall back safely to the current adult/trait/base portrait when a neonate file is not present.\n- Existing adult percentage artwork must not be regenerated as part of this phase.\n\n## Runtime behavior\n\n`ChondroSnakeIcon` accepts optional `lifeStage` and `neonateColor` props. Hatchling or Neonate animals request the matching base neonate file. Pure M. viridis saves and newly generated pure M. viridis animals are normalized to Yellow. If a neonate file is missing, the component falls back to the adult trait portrait and then the base subspecies portrait.\n\n## Future phase — only after base approval\n\nIf later gameplay benefits from illustrated high-expression neonates, use the naming pattern:\n\n`{subspecies}-{red|yellow}-{trait}-{tier}.webp`\n\nFor M. viridis, only the yellow branch is valid.\n\nExample:\n\n`utaraensis-red-high-white-95.webp`\n\nDo not begin that larger matrix until the seven base neonate images are visually approved in-game.\n''')
          PY

          rm .github/workflows/enforce-viridis-yellow-neonates.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/ChondroBreederGameV3.tsx src/components/ChondroSnakeIcon.tsx docs/chondro-neonate-assets.md .github/workflows/enforce-viridis-yellow-neonates.yml
          git commit -m 'Enforce yellow-only pure Viridis neonates'
          git push
