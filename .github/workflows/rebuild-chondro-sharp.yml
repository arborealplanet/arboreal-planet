name: Rebuild sharp Chondro base assets

on:
  push:
    branches:
      - asset-sharp-final
    paths:
      - '.github/workflows/rebuild-chondro-sharp.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild sharp base portraits
        shell: bash
        run: |
          set -euo pipefail
          cat .asset-staging-q40/uta-01a.txt .asset-staging-q40/uta-01b.txt .asset-staging-q40/uta-02.txt .asset-staging-q40/uta-03.txt .asset-staging-q40/uta-04.txt | base64 --decode > public/hatchery/snakes/utaraensis.avif
          cat .asset-staging-q40/vir-01.txt .asset-staging-q40/vir-02.txt .asset-staging-q40/vir-03.txt .asset-staging-q40/vir-04.txt | base64 --decode > public/hatchery/snakes/viridis.avif
          test "$(stat -c%s public/hatchery/snakes/utaraensis.avif)" -eq 15503
          test "$(stat -c%s public/hatchery/snakes/viridis.avif)" -eq 15905
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/ChondroSnakeIcon.tsx')
          text = path.read_text()
          text = text.replace('const TRAIT_ART_VERSION = "2026-09-09-d";', 'const TRAIT_ART_VERSION = "2026-09-09-e";')
          path.write_text(text)
          PY
          rm -rf .asset-staging-q40
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/hatchery/snakes/utaraensis.avif public/hatchery/snakes/viridis.avif src/components/ChondroSnakeIcon.tsx .asset-staging-q40
          git commit -m 'Sharpen Utaraensis and Viridis base portraits'
          git push
