name: Fix Chondro market economy client

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch client economy logic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/ChondroBreederGameV3.tsx')
          text = path.read_text()

          replacements = [
              (
                  '(((source === "Import" ? 900 : 2050) +',
                  '(((snake.source === "Import" ? 900 : 2050) +',
                  1,
              ),
              (
                  '      setCash((current) => current + value);\n      setSales((current) => [{ id: a.id, name: a.name, value, season }, ...current]);\n      setColony((current) => current.filter((item) => item.id !== a.id));',
                  '      setColony((current) => current.filter((item) => item.id !== a.id));',
                  1,
              ),
              (
                  '      setMarketStatus(`${a.name} is now available to every player.`);',
                  '      setMarketStatus(`${a.name} is listed for ${money(value)}. You will be paid after another player buys it.`);',
                  1,
              ),
              (
                  '    setCash((current) => current + total);\n    setSales((current) => [\n      ...sold.map((baby, index) => ({ id: baby.id, name: baby.name, value: saleItems[index].price, season })),\n      ...current,\n    ]);\n',
                  '',
                  1,
              ),
              (
                  '      setMarketStatus(`${sold.length} unheld offspring listed for ${money(total)} total.`);',
                  '      setMarketStatus(`${sold.length} unheld offspring listed at ${money(total)} combined asking price. Proceeds become claimable after buyers purchase them.`);',
                  1,
              ),
          ]

          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'Expected {expected} occurrence(s), found {count}: {old[:90]!r}')
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/fix-chondro-market-economy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ChondroBreederGameV3.tsx .github/workflows/fix-chondro-market-economy.yml
          git commit -m "Fix Chondro player market payout timing"
          git push
