name: Rebuild Chondro base assets

on:
  push:
    paths:
      - '.github/workflows/rebuild-chondro-base-assets.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild high-resolution base portraits
        shell: bash
        run: |
          set -euo pipefail
          cat .asset-staging/azurea-01.txt .asset-staging/azurea-02.txt .asset-staging/azurea-03.txt | base64 --decode > public/hatchery/snakes/azurea.avif
          cat .asset-staging/pulcher-01.txt .asset-staging/pulcher-02.txt .asset-staging/pulcher-03.txt | base64 --decode > public/hatchery/snakes/pulcher.avif
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/ChondroSnakeIcon.tsx')
          text = path.read_text()
          text = text.replace('const TRAIT_ART_VERSION = "2026-09-09-b";', 'const TRAIT_ART_VERSION = "2026-09-09-c";')
          text = text.replace('"Morelia azurea azurea": "/hatchery/snakes/azurea.webp",', '"Morelia azurea azurea": "/hatchery/snakes/azurea.avif",')
          text = text.replace('"Morelia azurea pulcher": "/hatchery/snakes/pulcher.webp",', '"Morelia azurea pulcher": "/hatchery/snakes/pulcher.avif",')
          path.write_text(text)
          PY
          test "$(stat -c%s public/hatchery/snakes/azurea.avif)" -eq 14619
          test "$(stat -c%s public/hatchery/snakes/pulcher.avif)" -eq 13597
          rm -rf .asset-staging
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/hatchery/snakes/azurea.avif public/hatchery/snakes/pulcher.avif src/components/ChondroSnakeIcon.tsx .asset-staging
          git commit -m 'Replace pixelated Azurea and Pulcher base portraits'
          git push
