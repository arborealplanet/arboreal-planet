name: Snake Sorter Capture Worker

on:
  workflow_dispatch:
    inputs:
      execute_capture:
        description: Explicitly arm the capture worker
        required: true
        type: boolean
        default: false
      limit:
        description: Maximum queued capture jobs to process
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SNAKE_SORTER_SUPABASE_URL: https://ykaqnxajszwgeqkmaora.supabase.co
      SNAKE_SORTER_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SNAKE_SORTER_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install capture worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Run offline capture-worker self-test
        run: python scripts/snake_sorter_capture_worker.py --self-test

      - name: Confirm worker is explicitly armed
        if: ${{ inputs.execute_capture == true }}
        shell: bash
        run: |
          if [ -z "$SNAKE_SORTER_SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SNAKE_SORTER_SUPABASE_SERVICE_ROLE_KEY is not configured."
            exit 1
          fi

      - name: Confirm worker remains disarmed
        if: ${{ inputs.execute_capture != true }}
        run: echo "Capture worker is DISARMED. Offline self-test passed; no MorphMarket pages were opened."

      - name: Process queued capture jobs
        if: ${{ inputs.execute_capture == true }}
        run: python scripts/snake_sorter_capture_worker.py --limit "${{ inputs.limit }}"
