name: Finalize Native Chondro Breeding Integration

on:
  push:
    branches:
      - gameplay-progression-prep
    paths:
      - .github/workflows/native-chondro-breeding-integration.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gameplay-progression-prep
          fetch-depth: 0
      - name: Correct hybrid locality handling and remove bridge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          game_path = Path("src/components/ChondroBreederGameV3.tsx")
          page_path = Path("src/app/hatchery/chondro-breeder/page.tsx")
          game = game_path.read_text()

          pattern = re.compile(
              r'  const locality: SnakeLocality = sameLocality\n'
              r'    \? dam\.locality\n'
              r'    : pureSame\n'
              r'      \? "Mixed Locality"\n'
              r'      : "Designer";'
          )
          replacement = (
              '  const locality: SnakeLocality = sameLocality\n'
              '    ? dam.locality\n'
              '    : classification === "Designer"\n'
              '      ? "Designer"\n'
              '      : "Mixed Locality";'
          )
          game, count = pattern.subn(replacement, game, count=1)
          if count == 0 and ': classification === "Designer"' not in game:
              raise SystemExit("Could not locate locality classification block")
          game_path.write_text(game)

          page = page_path.read_text()
          page = page.replace('import { ChondroCoreBreedingSync } from "@/components/ChondroCoreBreedingSync";\n', '')
          page = page.replace('      <ChondroCoreBreedingSync />\n', '')
          page_path.write_text(page)
          PY

          grep -q 'clutchSizeForPairing(dam, sire)' src/components/ChondroBreederGameV3.tsx
          grep -q 'inheritTraitSet(dam, sire)' src/components/ChondroBreederGameV3.tsx
          grep -q ': classification === "Designer"' src/components/ChondroBreederGameV3.tsx
          if grep -q 'inheritLineTrait(' src/components/ChondroBreederGameV3.tsx; then exit 1; fi
          if grep -q 'ChondroCoreBreedingSync' src/app/hatchery/chondro-breeder/page.tsx; then exit 1; fi

          rm -f src/components/ChondroCoreBreedingSync.tsx
          rm -f .github/workflows/native-chondro-breeding-integration.yml

          git config user.name "arborealplanet"
          git config user.email "arborealplanet@gmail.com"
          git add -A
          git commit -m "Finalize native Chondro breeding integration"
          git push origin HEAD:gameplay-progression-prep
