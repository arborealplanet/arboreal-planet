name: Native Chondro Breeding Integration

on:
  push:
    branches:
      - gameplay-progression-prep
    paths:
      - .github/workflows/native-chondro-breeding-integration.yml
      - src/components/ChondroBreederGameV3.tsx
      - src/app/hatchery/chondro-breeder/page.tsx
      - src/lib/chondro-genetics.ts
      - src/lib/chondro-clutch-size.ts

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gameplay-progression-prep
          fetch-depth: 0
      - name: Integrate genetics and clutch sizing natively
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          game_path = Path("src/components/ChondroBreederGameV3.tsx")
          page_path = Path("src/app/hatchery/chondro-breeder/page.tsx")
          game = game_path.read_text()

          import_anchor = 'import { ChondroSnakeIcon } from "@/components/ChondroSnakeIcon";\n'
          native_imports = (
              'import { ChondroSnakeIcon } from "@/components/ChondroSnakeIcon";\n'
              'import { clutchSizeForPairing } from "@/lib/chondro-clutch-size";\n'
              'import { inheritTraitSet } from "@/lib/chondro-genetics";\n'
          )
          if 'from "@/lib/chondro-genetics"' not in game:
              if import_anchor not in game:
                  raise SystemExit("Could not find ChondroSnakeIcon import anchor")
              game = game.replace(import_anchor, native_imports, 1)

          old_classification = '''function classifyPair(a: Snake, b: Snake): Classification {
            if (a.classification !== "Pure" || b.classification !== "Pure") return "Designer";
            return a.subspecies === b.subspecies ? "Pure" : "Hybrid";
          }

          function inheritLineTrait(
            a: number,
            b: number,
            subspecies: Subspecies,
            key: TraitKey,
            pureSame: boolean,
          ) {
            const midpoint = (a + b) / 2;
            const isPreferred = key !== "blotches" && preferredTraits[subspecies].includes(key);
            const directionalLift = pureSame ? (isPreferred ? 2.5 : 0.4) : 0;
            const ordinary = midpoint + directionalLift + (Math.random() + Math.random() - 1) * 14;
            const breakout = Math.random() < 0.012 ? 12 + Math.random() * 24 : 0;
            const setback = Math.random() < 0.025 ? -(5 + Math.random() * 10) : 0;
            let raw = ordinary + breakout + setback;
            if (raw > 85 && midpoint < 65) raw = 85 + (raw - 85) * 0.35;
            return clamp(raw);
          }
          '''.replace('          ', '')
          new_classification = '''function classifyPair(a: Snake, b: Snake): Classification {
            if (a.classification === "Designer" || b.classification === "Designer") return "Designer";
            if (a.classification === "Hybrid" || b.classification === "Hybrid") return "Hybrid";
            return a.subspecies === b.subspecies ? "Pure" : "Hybrid";
          }
          '''.replace('          ', '')
          if old_classification in game:
              game = game.replace(old_classification, new_classification, 1)
          elif 'function inheritLineTrait(' in game:
              raise SystemExit("Legacy inheritance function changed unexpectedly")

          old_locality = '''  const locality: SnakeLocality = sameLocality
            ? dam.locality
            : pureSame
              ? "Mixed Locality"
              : "Designer";
          const subspecies = pureSame ? dam.subspecies : structural.subspecies;
          return {
          '''.replace('          ', '')
          new_locality = '''  const locality: SnakeLocality = sameLocality
            ? dam.locality
            : classification === "Designer"
              ? "Designer"
              : "Mixed Locality";
          const subspecies = pureSame ? dam.subspecies : structural.subspecies;
          const inheritedTraits = inheritTraitSet(dam, sire);
          return {
          '''.replace('          ', '')
          if old_locality in game:
              game = game.replace(old_locality, new_locality, 1)
          elif 'const inheritedTraits = inheritTraitSet(dam, sire);' not in game:
              raise SystemExit("Could not find offspring locality block")

          trait_replacements = {
              'highBlack: inheritLineTrait(dam.highBlack, sire.highBlack, subspecies, "highBlack", pureSame),': 'highBlack: inheritedTraits.highBlack,',
              'highWhite: inheritLineTrait(dam.highWhite, sire.highWhite, subspecies, "highWhite", pureSame),': 'highWhite: inheritedTraits.highWhite,',
              'blueStripe: inheritLineTrait(dam.blueStripe, sire.blueStripe, subspecies, "blueStripe", pureSame),': 'blueStripe: inheritedTraits.blueStripe,',
              'yellowRetention: inheritLineTrait(dam.yellowRetention, sire.yellowRetention, subspecies, "yellowRetention", pureSame),': 'yellowRetention: inheritedTraits.yellowRetention,',
              'blotches: inheritLineTrait(dam.blotches ?? 0, sire.blotches ?? 0, subspecies, "blotches", pureSame),': 'blotches: inheritedTraits.blotches,',
          }
          for old, new in trait_replacements.items():
              if old in game:
                  game = game.replace(old, new, 1)

          old_clutch = '''function createClutch(dam: Snake, sire: Snake, breederInitials: string): Clutch {
            const id = `CL-${Date.now().toString(36).toUpperCase()}`;
            const size = 5 + Math.floor(Math.random() * 5);
            return {
          '''.replace('          ', '')
          new_clutch = '''function createClutch(dam: Snake, sire: Snake, breederInitials: string): Clutch {
            const id = `CL-${Date.now().toString(36).toUpperCase()}`;
            const size = clutchSizeForPairing(dam, sire);
            return {
          '''.replace('          ', '')
          if old_clutch in game:
              game = game.replace(old_clutch, new_clutch, 1)
          elif 'const size = clutchSizeForPairing(dam, sire);' not in game:
              raise SystemExit("Could not find legacy clutch-size roll")

          if 'inheritLineTrait(' in game:
              raise SystemExit("Legacy inheritance call remains after integration")
          if 'const size = 5 + Math.floor(Math.random() * 5);' in game:
              raise SystemExit("Legacy 5-9 clutch roll remains after integration")

          game_path.write_text(game)

          page = page_path.read_text()
          page = page.replace('import { ChondroCoreBreedingSync } from "@/components/ChondroCoreBreedingSync";\n', '')
          page = page.replace('      <ChondroCoreBreedingSync />\n', '')
          page_path.write_text(page)
          PY
      - name: Verify native integration markers
        shell: bash
        run: |
          grep -q 'clutchSizeForPairing(dam, sire)' src/components/ChondroBreederGameV3.tsx
          grep -q 'inheritTraitSet(dam, sire)' src/components/ChondroBreederGameV3.tsx
          if grep -q 'inheritLineTrait(' src/components/ChondroBreederGameV3.tsx; then exit 1; fi
          if grep -q 'ChondroCoreBreedingSync' src/app/hatchery/chondro-breeder/page.tsx; then exit 1; fi
      - name: Commit native integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Native breeding integration already applied."
            exit 0
          fi
          git config user.name "arborealplanet"
          git config user.email "arborealplanet@gmail.com"
          git add src/components/ChondroBreederGameV3.tsx src/app/hatchery/chondro-breeder/page.tsx
          git commit -m "Integrate breeding engine directly into Chondro V3"
          git push origin HEAD:gameplay-progression-prep
